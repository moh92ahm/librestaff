name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://librestaff:librestaff@127.0.0.1:5432/librestaff
      NEXTAUTH_SECRET: ci-only-nextauth-secret-that-is-at-least-32-characters
      SETUP_SECRET: ci-only-setup-secret-that-is-at-least-32-characters
      EMAIL_SETTINGS_ENCRYPTION_KEY: ci-only-email-key-that-is-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret-that-is-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run integration tests
        run: pnpm test:int

      - name: Build production application
        run: pnpm build

# This file is mounted as /etc/nginx/templates/default.conf.template.
# The official nginx Docker image substitutes NGINX_SERVER_NAME and
# NGINX_CERT_NAME at container startup.

server {
  listen 80;
  server_name ${NGINX_SERVER_NAME};

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${NGINX_SERVER_NAME};

  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  ssl_certificate     ${NGINX_CERT_PATH};
  ssl_certificate_key ${NGINX_CERT_KEY_PATH};

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 25m;

  location / {
    set $app_upstream app:3000;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
}
